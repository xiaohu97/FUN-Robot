name: 📄 推荐论文
description: 推荐一篇值得收录的机器人 / 具身智能论文
title: "[论文推荐] "
labels: ["paper"]
body:
  - type: input
    id: link
    attributes:
      label: 论文链接
      description: 优先填写 arXiv 链接（不带版本号），如 https://arxiv.org/abs/2410.24164
    validations:
      required: true
  - type: input
    id: short
    attributes:
      label: 简称
      placeholder: "π0"
  - type: dropdown
    id: topic
    attributes:
      label: 建议分类
      options:
        - 01 VLA 与机器人基础模型
        - 02 世界动作模型（WAM）
        - 03 世界模型与视频生成
        - 04 具身推理与任务规划
        - 05 机器人智能体与自我进化
        - 06 模仿学习与策略学习
        - 07 强化学习与后训练
        - 08 奖励模型、失败检测与恢复
        - 09 记忆与长时程任务
        - 10 足式运动控制
        - 11 人形机器人
        - 12 操作、抓取与灵巧手
        - 13 触觉与接触感知
        - 14 具身导航与移动操作
        - 15 视觉表征与 3D 场景理解
        - 16 数据采集、遥操作与人类视频
        - 17 仿真、Sim2Real 与评测基准
        - 18 综述与教程
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: 经典 / 最新
      options:
        - 🚀 最新进展
        - 🏛 经典论文
  - type: textarea
    id: summary
    attributes:
      label: 一句话贡献（中文，≤60 字）
      placeholder: "VLM + flow matching 动作专家，输出 50Hz 连续动作，完成叠衣服等长程灵巧任务"
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: 代码 / 项目主页（可选）
